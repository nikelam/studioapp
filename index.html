ont-size:14px\">MẪU CRM TRÊN LARK DÀNH CHO STUDIO NHIẾP ẢNH<\u002Fp>\n<h1 style=\"font-size:54px;line-height:1.12;font-weight:800;letter-spacing:-0.03em;margin:0 0 24px\">Xây dựng hệ thống CRM dành riêng cho Studio Nhiếp ảnh<\u002Fh1>\n<p style=\"font-size:19px;color:#C9D2DA;margin:0 0 36px\">Mẫu quản lý khách hàng trên Lark Base, thiết kế cho studio có lượng khách và nhân sự ngày càng tăng, nhưng vẫn đang phụ thuộc vào Zalo, Excel và lịch sử tin nhắn để quản lý công việc.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:12px\"><a class=\"btn\" href=\"#lien-he\">Nhận mẫu CRM cho studio<\u002Fa><a class=\"btn2\" href=\"#van-de\">Xem 5 vấn đề được giải quyết<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1 1 380px;background:#1D2C3A;border:1px solid #2A3743;border-radius:14px;padding:24px\">\n<p style=\"margin:0 0 16px;color:#93A1AD;font-size:14px\">Một khách hàng, một dòng, đi qua toàn bộ quy trình<\u002Fp>\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div style=\"background:#14202B;border-left:4px solid #3B7DD8;padding:10px 14px;border-radius:6px\">Tư vấn<\u002Fdiv>\n<div style=\"background:#14202B;border-left:4px solid #C98F0A;padding:10px 14px;border-radius:6px\">Chốt đơn, đến studio, trang điểm<\u002Fdiv>\n<div style=\"background:#14202B;border-left:4px solid #E0A526;padding:10px 14px;border-radius:6px\">Chụp ảnh<\u002Fdiv>\n<div style=\"background:#14202B;border-left:4px solid #7A5AC8;padding:10px 14px;border-radius:6px\">Chọn ảnh, chỉnh ảnh<\u002Fdiv>\n<div style=\"background:#14202B;border-left:4px solid #4CC38A;padding:10px 14px;border-radius:6px\">Giao ảnh, mua lại, giới thiệu<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\" id=\"van-de\" style=\"background:#F4F5F3\">\n<div class=\"wrap\">\n<h2 class=\"h2\">5 vấn đề chính mà mẫu CRM này giải quyết<\u002Fh2>\n<p class=\"lead\">Studio của bạn không cần một phần mềm phức tạp ngay từ đầu. Bạn cần chuẩn hóa dữ liệu về khách hàng, đơn hàng, công việc và hiệu suất nhân sự.<\u002Fp>\n<div class=\"grid\">\n<div class=\"card\"><div class=\"num\">1<\u002Fdiv><h3>Quản lý thông tin khách hàng tập trung<\u002Fh3><p>Tất cả thông tin được quản lý tại một nơi:<\u002Fp><ul><li>Nguồn khách hàng<\u002Fli><li>Trạng thái tư vấn<\u002Fli><li>Nhu cầu chụp ảnh<\u002Fli><li>Ngân sách dự kiến<\u002Fli><li>Trạng thái chốt đơn<\u002Fli><li>Lịch sử chăm sóc và theo dõi khách hàng<\u002Fli><\u002Ful><p style=\"margin:12px 0 0\">Không còn phải mất thời gian tìm lại những đoạn hội thoại cũ mỗi khi cần tra cứu.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><div class=\"num\">2<\u002Fdiv><h3>Phân chia vai trò và trách nhiệm rõ ràng<\u002Fh3><p>Nhiếp ảnh gia, nhân viên tư vấn, vận hành, chọn ảnh và chỉnh sửa ảnh đều có giao diện quản lý riêng.<\u002Fp><p>Mỗi người chỉ nhìn thấy khách hàng và công việc thuộc phạm vi trách nhiệm của mình, giúp giảm chồng chéo và hỗn loạn thông tin.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><div class=\"num\">3<\u002Fdiv><h3>Theo dõi toàn bộ quy trình chụp ảnh<\u002Fh3><p>Từ khi khách liên hệ, tư vấn, chốt đơn, chụp ảnh, chọn ảnh, chỉnh sửa, bàn giao cho đến mua lại hoặc giới thiệu khách mới.<\u002Fp><p>Bạn xem được tiến độ hiện tại của từng khách hàng ở mỗi giai đoạn.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><div class=\"num\">4<\u002Fdiv><h3>Bảng điều khiển hiệu suất kinh doanh<\u002Fh3><p>Theo dõi các chỉ số của từng nhân viên tư vấn:<\u002Fp><ul><li>Số lượng khách hàng<\u002Fli><li>Số đơn hàng chốt thành công<\u002Fli><li>Doanh thu<\u002Fli><li>Tỷ lệ chuyển đổi<\u002Fli><\u002Ful><p style=\"margin:12px 0 0\">Chủ studio dễ dàng đánh giá nhân viên nào làm tốt hơn và kênh khách nào hiệu quả hơn.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><div class=\"num\">5<\u002Fdiv><h3>Bảng điều khiển riêng cho từng vị trí<\u002Fh3><p>Công việc được quản lý riêng theo từng bộ phận:<\u002Fp><ul><li>Nhiếp ảnh gia: lịch chụp và lịch làm việc<\u002Fli><li>Chỉnh sửa ảnh: danh sách ảnh cần chỉnh và tiến độ hoàn thành<\u002Fli><li>Chọn ảnh: tiến độ chọn ảnh của khách hàng<\u002Fli><li>Vận hành: công việc theo dõi và chăm sóc khách hàng<\u002Fli><\u002Ful><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\" style=\"background:#fff\" id=\"xem-tan-mat\">\n<div class=\"wrap\">\n<h2 class=\"h2\">Xem tận mắt từng điều chúng tôi hứa<\u002Fh2>\n<p class=\"lead\">Mỗi hình dưới đây lấy từ bản demo chạy thật, dùng dữ liệu mẫu của một studio giả định. Bạn có thể tự bấm thử, kéo thả và đổi vai trò nhân viên trong bản demo.<\u002Fp>\n<p style=\"margin:0 0 24px\"><a class=\"btn\" href=\"https://claude.ai/artifact/35F9HecmTznPacC7W1P1qv\">Dùng thử bản demo<\u002Fa><\u002Fp>\n\n<div class=\"px\">\n<div class=\"tx\"><div class=\"num\">1<\u002Fdiv><h3>Mọi thông tin khách nằm trên một dòng<\u002Fh3><p>Nguồn khách, ý định, nhu cầu, ngân sách, trạng thái chốt, tiền cọc, tiền còn phải thu và người phụ trách. Cột được chia thành 5 nhóm để nhìn không bị rối.<\u002Fp><p>Muốn biết khách nói gì lần trước, bạn mở dòng đó, không cần lục tin nhắn.<\u002Fp><\u002Fdiv>\n<div class=\"mk\"><div class=\"mock\"><div class=\"gp\"><span>01 Thông tin cơ bản<\u002Fspan><span>02 Nguồn và vận hành<\u002Fspan><span>03 Theo dõi bán hàng<\u002Fspan><span>04 Thanh toán<\u002Fspan><span>05 Chụp và hậu kỳ<\u002Fspan><\u002Fdiv><sc-raw-table><sc-raw-thead><sc-raw-tr><sc-raw-th>Khách<\u002Fsc-raw-th><sc-raw-th>Nguồn<\u002Fsc-raw-th><sc-raw-th>Ý định<\u002Fsc-raw-th><sc-raw-th>Trạng thái<\u002Fsc-raw-th><sc-raw-th>Sales<\u002Fsc-raw-th><sc-raw-th>Giá trị<\u002Fsc-raw-th><sc-raw-th>Cọc<\u002Fsc-raw-th><sc-raw-th>Còn phải thu<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Ngọc Anh &amp; Minh Khôi<\u002Fsc-raw-td><sc-raw-td>Facebook<\u002Fsc-raw-td><sc-raw-td>Cao<\u002Fsc-raw-td><sc-raw-td><span class=\"tg\">Đã chốt<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Lan Anh<\u002Fsc-raw-td><sc-raw-td>18.000.000₫<\u002Fsc-raw-td><sc-raw-td>6.000.000₫<\u002Fsc-raw-td><sc-raw-td>12.000.000₫<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Thu Hà<\u002Fsc-raw-td><sc-raw-td>Zalo<\u002Fsc-raw-td><sc-raw-td>Trung bình<\u002Fsc-raw-td><sc-raw-td><span class=\"tg\">Tư vấn<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Quốc Bảo<\u002Fsc-raw-td><sc-raw-td>1.500.000₫<\u002Fsc-raw-td><sc-raw-td>0₫<\u002Fsc-raw-td><sc-raw-td>0₫<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Bảo Trân<\u002Fsc-raw-td><sc-raw-td>Instagram<\u002Fsc-raw-td><sc-raw-td>Trung bình<\u002Fsc-raw-td><sc-raw-td><span class=\"tg\">Chọn ảnh<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Quốc Bảo<\u002Fsc-raw-td><sc-raw-td>4.000.000₫<\u002Fsc-raw-td><sc-raw-td>1.000.000₫<\u002Fsc-raw-td><sc-raw-td>3.000.000₫<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><p class=\"cap\">Dữ liệu mẫu minh họa<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"px\">\n<div class=\"tx\"><div class=\"num\">2<\u002Fdiv><h3>Mỗi người chỉ thấy phần việc của mình<\u002Fh3><p>Chọn tên nhân viên trong bản demo, màn hình tự lọc theo đúng khách và đúng bước họ phụ trách.<\u002Fp><p>Nhiếp ảnh gia, trang điểm, chọn ảnh và chỉnh ảnh không nhìn thấy các cột tiền.<\u002Fp><\u002Fdiv>\n<div class=\"mk\"><div class=\"mock\"><div class=\"sub\"><div><b>Sales · Lan Anh<\u002Fb>Thấy khách mình phụ trách và hạn chăm sóc. Khách “Lớp 12A1” được đánh dấu quá hạn.<br>Thấy cột tiền.<\u002Fdiv><div><b>Nhiếp ảnh gia · Minh Tuấn<\u002Fb>Chỉ thấy các buổi chụp được giao.<br>Không thấy cột tiền.<\u002Fdiv><div><b>Chỉnh ảnh · Gia Huy<\u002Fb>Chỉ thấy khách đang ở bước chỉnh ảnh, ví dụ “Cửa hàng Mộc, 60 sản phẩm”.<br>Không thấy cột tiền.<\u002Fdiv><\u002Fdiv><p class=\"cap\">Dữ liệu mẫu minh họa<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"px\">\n<div class=\"tx\"><div class=\"num\">3<\u002Fdiv><h3>Biết khách đang ở bước nào, ai đang giữ việc<\u002Fh3><p>Quy trình đi từ tư vấn, chốt đơn, đến studio, trang điểm, chụp, chọn ảnh, chỉnh ảnh, giao ảnh, rồi mua lại hoặc giới thiệu.<\u002Fp><p>Mỗi lần chuyển bước đều được ghi lại kèm ngày.<\u002Fp><\u002Fdiv>\n<div class=\"mk\"><div class=\"mock\"><p style=\"margin:0 0 10px;font-weight:600\">Bảo Trân · Gói Em bé<\u002Fp><div class=\"trk\"><span class=\"dn\">Tư vấn<\u002Fspan><span class=\"dn\">Đã chốt<\u002Fspan><span class=\"dn\">Trang điểm<\u002Fspan><span class=\"dn\">Đang chụp<\u002Fspan><span class=\"cu\">Chọn ảnh<\u002Fspan><span>Chỉnh ảnh<\u002Fspan><span>Giao ảnh<\u002Fspan><span>Quay lại / giới thiệu<\u002Fspan><\u002Fdiv><p style=\"margin:0;font-size:13px;color:#4A5966\">Bước hiện tại thuộc về: Phương Linh (Chọn ảnh)<br>Nhật ký: Tạo hồ sơ khách → Chuyển sang Chọn ảnh<\u002Fp><p class=\"cap\">Dữ liệu mẫu minh họa<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"px\">\n<div class=\"tx\"><div class=\"num\">4<\u002Fdiv><h3>Biết nhân viên nào và kênh nào làm tốt hơn<\u002Fh3><p>Số khách, số đơn chốt, giá trị và tỷ lệ chuyển đổi cho từng Sales và từng nguồn khách. Chủ studio thấy ngay nên đầu tư vào kênh nào.<\u002Fp><\u002Fdiv>\n<div class=\"mk\"><div class=\"mock\"><sc-raw-table><sc-raw-thead><sc-raw-tr><sc-raw-th>Sales<\u002Fsc-raw-th><sc-raw-th>Khách<\u002Fsc-raw-th><sc-raw-th>Chốt<\u002Fsc-raw-th><sc-raw-th>Giá trị<\u002Fsc-raw-th><sc-raw-th>Chuyển đổi<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Lan Anh<\u002Fsc-raw-td><sc-raw-td>5<\u002Fsc-raw-td><sc-raw-td>4<\u002Fsc-raw-td><sc-raw-td>44.000.000₫<\u002Fsc-raw-td><sc-raw-td>80%<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Quốc Bảo<\u002Fsc-raw-td><sc-raw-td>4<\u002Fsc-raw-td><sc-raw-td>2<\u002Fsc-raw-td><sc-raw-td>7.500.000₫<\u002Fsc-raw-td><sc-raw-td>50%<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><p class=\"cap\">Số liệu của dữ liệu mẫu trong bản demo, không phải số liệu thật của studio nào<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"px\">\n<div class=\"tx\"><div class=\"num\">5<\u002Fdiv><h3>Mỗi vị trí có bảng việc riêng<\u002Fh3><p>Nhiếp ảnh gia xem lịch chụp. Người chọn ảnh xem tiến độ chọn ảnh. Người chỉnh ảnh xem danh sách cần chỉnh. Vận hành xem việc chăm sóc và nhắc khách quay lại.<\u002Fp><\u002Fdiv>\n<div class=\"mk\"><div class=\"mock\"><div class=\"sub\"><div><b>Nhiếp ảnh gia<\u002Fb>Lịch chụp theo ngày, nhắc buổi chụp sắp tới.<\u002Fdiv><div><b>Chọn ảnh<\u002Fb>Khách đang chờ chọn ảnh, sắp theo hạn.<\u002Fdiv><div><b>Chỉnh ảnh<\u002Fb>Danh sách cần chỉnh, nút “Xong” để chuyển sang giao ảnh.<\u002Fdiv><div><b>Vận hành<\u002Fb>Giao ảnh, thu tiền đuôi, nhắc khách mua lại.<\u002Fdiv><\u002Fdiv><p class=\"cap\">Mô tả theo bản demo<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\" style=\"background:#fff\">\n<div class=\"wrap\">\n<h2 class=\"h2\">Chuẩn hóa toàn bộ quy trình vận hành của studio<\u002Fh2>\n<p class=\"lead\">Đây không đơn thuần là một bảng quản lý khách hàng. Nó đi từ Marketing đến chăm sóc sau bán, và mỗi bước đều có người phụ trách rõ ràng.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:14px\">\n<div class=\"step\"><b>Marketing<\u002Fb><span>Nguồn khách, người vận hành, mức độ ý định<\u002Fspan><\u002Fdiv>\n<div class=\"step\"><b>Sales<\u002Fb><span>Tư vấn, báo giá, chốt đơn, thu tiền cọc<\u002Fspan><\u002Fdiv>\n<div class=\"step\"><b>Chụp ảnh<\u002Fb><span>Lễ tân, trang điểm, nhiếp ảnh gia<\u002Fspan><\u002Fdiv>\n<div class=\"step\"><b>Hậu kỳ<\u002Fb><span>Chọn ảnh, chỉnh sửa ảnh<\u002Fspan><\u002Fdiv>\n<div class=\"step\"><b>Bàn giao<\u002Fb><span>Giao ảnh, thu tiền đuôi<\u002Fspan><\u002Fdiv>\n<div class=\"step\"><b>Chăm sóc sau bán<\u002Fb><span>Mua lại, giới thiệu khách mới<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\" style=\"background:#F4F5F3\">\n<div class=\"wrap\">\n<h2 class=\"h2\">Bạn nhận được gì trong mẫu<\u002Fh2>\n<p class=\"lead\">Mẫu dựng sẵn trên Lark Base, bạn thay dữ liệu mẫu bằng dữ liệu thật của studio là dùng được.<\u002Fp>\n<div class=\"grid\">\n<div class=\"card\"><h3>Bảng tổng khách hàng<\u002Fh3><p>Toàn bộ thông tin khách, đơn hàng, thanh toán và tiến độ trên một dòng, chia nhóm cột rõ ràng.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><h3>Góc nhìn theo vai trò<\u002Fh3><p>Sales, lễ tân, trang điểm, nhiếp ảnh gia, chọn ảnh, chỉnh ảnh, vận hành và quản lý, mỗi người một màn hình riêng.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><h3>Dashboard cho chủ studio<\u002Fh3><p>Khách và đơn, giá trị đã chốt, tiền đuôi chờ thu, khách chờ chụp, hậu kỳ chờ xử lý, doanh thu theo tháng và theo nguồn.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><h3>Cấu hình gói dịch vụ<\u002Fh3><p>Quản lý tên gói, giá và nội dung đi kèm, chọn gói là giá tự điền vào đơn.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><h3>Nhắc việc tự động<\u002Fh3><p>Nhắc đúng người, đúng hạn: chăm sóc khách, lịch chụp, giao ảnh.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><h3>Hướng dẫn triển khai<\u002Fh3><p>Hướng dẫn từng bước để studio tự nhập dữ liệu và đưa nhân viên vào sử dụng.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\" style=\"background:#fff\">\n<div class=\"wrap\">\n<h2 class=\"h2\">Phù hợp với những mô hình nào<\u002Fh2>\n<p class=\"lead\">Từ studio nhỏ đến đội ngũ nhiều vai trò, miễn là khách và nhân sự đang tăng nhưng việc quản lý vẫn còn thủ công.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n<span class=\"chip\">Studio chụp ảnh<\u002Fspan><span class=\"chip\">Studio ảnh chân dung<\u002Fspan><span class=\"chip\">Studio ảnh cưới<\u002Fspan><span class=\"chip\">Studio chụp ảnh mẹ và bé<\u002Fspan><span class=\"chip\">Đội ngũ chụp ảnh thương mại<\u002Fspan><span class=\"chip\">Đội sản xuất nội dung quy mô nhỏ<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\" style=\"background:#F4F5F3\">\n<div class=\"wrap\">\n<h2 class=\"h2\">Triển khai cho studio của bạn như thế nào<\u002Fh2>\n<p class=\"lead\">Bạn biết trước từng bước, từng thứ sẽ nhận và dữ liệu nằm ở đâu.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:14px;margin-bottom:32px\">\n<div class=\"step\"><b>1. Tìm hiểu studio<\u002Fb><span>Vai trò, gói dịch vụ, quy trình hiện tại. [THỜI GIAN]<\u002Fspan><\u002Fdiv>\n<div class=\"step\"><b>2. Cấu hình<\u002Fb><span>Bảng khách, gói, góc nhìn, dashboard, nhắc việc. [THỜI GIAN]<\u002Fspan><\u002Fdiv>\n<div class=\"step\"><b>3. Nhập dữ liệu và hướng dẫn<\u002Fb><span>Chuyển khách cũ từ Excel, hướng dẫn từng vai trò. [THỜI GIAN]<\u002Fspan><\u002Fdiv>\n<div class=\"step\"><b>4. Chạy thử và hỗ trợ<\u002Fb><span>Theo dõi tuần đầu, chỉnh theo phản hồi. [THỜI GIAN HỖ TRỢ]<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"grid\">\n<div class=\"card\"><h3>Dữ liệu thuộc về studio<\u002Fh3><p>Bảng được tạo trong tài khoản Lark của studio, chủ studio quyết định ai được xem và sửa.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><h3>Bạn thấy trước khi quyết định<\u002Fh3><p>Bản demo ở trên cho phép thao tác thử với dữ liệu mẫu, không cần đăng ký.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><h3>[PHẢN HỒI TỪ STUDIO ĐÃ DÙNG]<\u002Fh3><p>Chỗ dành cho nhận xét thật của khách hàng. Chỉ điền khi có sự đồng ý của họ.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\" style=\"background:#14202B;color:#fff\" id=\"lien-he\">\n<div class=\"wrap\" style=\"max-width:860px;text-align:center\">\n<h2 class=\"h2\" style=\"color:#fff\">Studio nhiếp ảnh thực sự cần một hệ thống CRM tinh gọn<\u002Fh2>\n<p style=\"font-size:19px;color:#C9D2DA;margin:0 0 16px\">Bạn không nhất thiết phải xây dựng một phần mềm phức tạp ngay từ đầu. Nhưng ít nhất, hãy quản lý được dữ liệu về khách hàng, đơn hàng, công việc và hiệu suất nhân sự.<\u002Fp>\n<p style=\"font-size:19px;color:#C9D2DA;margin:0 0 36px\">Nếu studio của bạn vẫn quản lý khách hàng thủ công bằng Zalo và Excel, hãy thử áp dụng phương pháp này.<\u002Fp>\n<p style=\"margin:0 0 8px;color:#E0A526;font-weight:700\">[GIÁ MẪU / GÓI TRIỂN KHAI CỦA BẠN]<\u002Fp>\n<a class=\"btn\" href=\"#lien-he\" style=\"font-size:18px\">Liên hệ: [ZALO / SỐ ĐIỆN THOẠI CỦA BẠN]<\u002Fa>\n<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:7300}}\">\nclass Component extends DCLogic {\nrenderVals() {\nreturn {};\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
